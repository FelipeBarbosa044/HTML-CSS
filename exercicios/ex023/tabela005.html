<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio De Tabela</title>
    <style>
        body
        {
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 300px;
            height: 300px;
            
        }
        caption{
            font-size:1.3em;
            font-weight: bold;
            padding:10px;
        }
        th,td{
            border: 2px solid black;
            text-align: center;
            padding: 6px;
        }
       .cnome{
        
        padding: 6px;
        background-color: aqua;
       }
       .csede{
        background-color: yellow;
       }
       .cprofissa{
        background-color: blueviolet;
       }
    </style>
</head>
<body>
    <h1>Exercicio De Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col span="2" class="csede">
            <col class="cprofissa">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Felipe Barbosa</td>
            <td>M</td>
            <td>19</td>
            <td>Programado</td>
        </tr>
        <tr>
            <td>Alice</td>
            <td>F</td>
            <td>7</td>
            <td>Engenheira</td>
        </tr>
        <tr>
            <td>Lucas</td>
            <td>M</td>
            <td>16</td>
            <td>Policial</td>
        </tr>
        <tr>
            <td>Yuri</td>
            <td>M</td>
            <td>30</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Victor</td>
            <td>M</td>
            <td>18</td>
            <td>Programador</td>
        </tr>
    </table>
</body>
</html>
