<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 415px;
            height: 415px;
            border-collapse: collapse;
        }
        th{
            border: 2px solid black;
            background-color: gray;
            color: white;
            padding: 6px;
        }
        td{
            border: 2px solid black;
            text-align: center;
            padding: 6px;
        }
        .Matéria{
            font-weight: bolder;
            text-align: center;
        }
        .Média{
            font-weight: bolder;
            background-color: gray;
            color: white;
           
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
            <th scope="colgroup" rowspan="2">Área</th>
            <th scope="colgroup" rowspan="2">Disciplinas</th>
            <th scope="colgroup" colspan="2">Notas</th>
            <th scope="colgroup" rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tr>
            <td rowspan="4" class="Matéria">Exatas</td>
            <td>Mátematia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
         <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th scope="row" colspan="4">Média de Exatas</th>
            <td class="Média">0.0</td>
        </tr>
        <tr>
            <td rowspan="2" class="Matéria"> Humanas</td>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
         <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
         </tr>
         <tr>
            <th scope="row" colspan="4">Média de Humanas</th>
            <td class="Média">0.0</td>
        </tr>
    
    </table>
</body>
</html>
